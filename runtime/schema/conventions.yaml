# conventions.yaml — System-level constants / Системные константы, которые схема не может вывести.
# 

# How a slug is shaped / Как формируется slug.  Generation rule / Правило: ключевые слова заголовка,
# через дефис, нижний регистр.  This regex validates / Этот regex проверяет результат.
# NB: Cyrillic allowed for construction domain / кириллица разрешена для строительного домена.
slug_rule: "^[а-яёa-z0-9]+(-[а-яёa-z0-9]+)*$"

# Where an entity page lives, given its kind and slug / Путь страницы сущности по виду и slug.
path_pattern: "wiki/{kind}/{slug}.md"

# How wikilinks resolve / Как разрешаются вики-ссылки.  `[[slug]]` ищет по каталогам сущностей.
wikilink_syntax: "[[slug]]"

# All schema dates are ISO 8601 / Все даты в ISO 8601.
date_format: "YYYY-MM-DD"

# Append-only log line grammar / Грамматика строки лога (только добавление).
log_grammar: "## [{date}] {skill} | {details}"

# File-system ownership rules / Правила владения файловой системой.
ownership:
  user_owned:  [raw/papers, raw/notes, raw/web]   # skills must not overwrite
  tools_only:  [wiki/graph]                       # only via tools/research_wiki.py
  append_only: [wiki/log.md]                      # never rewritten in place

# Where each edge type is physically stored.
edge_storage:
  default: wiki/graph/edges.jsonl
  exceptions:
    cites: wiki/graph/citations.jsonl
