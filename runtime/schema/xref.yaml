# xref.yaml — Bidirectional link contract / Контракт двунаправленных ссылок.
#
# Whenever entity A writes a forward link to entity B, the reverse update on B
# is required / Когда сущность A пишет прямую ссылку на B, обратное обновление B обязательно.
# Each rule has / Каждое правило имеет:
#
#   forward.kind                     source entity kind / вид сущности-источника
#   forward.<frontmatter_field |     where the forward link lives / где живёт прямая ссылка:
#            body_section       |       frontmatter list field / поле списка в frontmatter, ИЛИ
#            edge_type>                 body section (use '*' for any) / раздел тела ('*' — любой), ИЛИ
#                                       graph edge type / тип ребра графа
#   forward.target                   target entity kind / вид целевой сущности
#
#   reverse.kind                     target entity kind (same as forward.target) / вид целевой (совпадает)
#   reverse.<frontmatter_field |     where the reverse update goes / куда идёт обратное обновление
#            body_section>
#   reverse.action                   append_slug | append_record
#   record                           record template (only for append_record) / шаблон записи (только append_record);
#                                    {from} expands to the source slug / {from} заменяется на slug источника
#
# Foundations are terminal: any link to foundations writes no reverse / Фундаментальные страницы терминальны: ссылка на них не создаёт обратной связи.
#
# Edge-based reverse links (auto_reverse in edge-rules.yaml) are handled by the
# graph engine, not by xref.yaml. This file covers only frontmatter-to-frontmatter
# and body-wikilink-to-frontmatter reverse rules.

rules:

  # документы body wikilink → понятия → понятия body "Источники"
  - forward: { kind: документы,   body_section: '*',         target: понятия }
    reverse: { kind: понятия,     body_section: "Источники", action: append_slug }

  # документы body wikilink → процессы → процессы body "Нормативные ссылки"
  - forward: { kind: документы,   body_section: '*',         target: процессы }
    reverse: { kind: процессы,    body_section: "Нормативные ссылки", action: append_slug }

  # процессы body wikilink → документы → документы body "Применяется в"
  - forward: { kind: процессы,    body_section: '*',         target: документы }
    reverse: { kind: документы,   body_section: "Применяется в", action: append_slug }

  # понятия body wikilink → документы → документы body "Связанные понятия"
  - forward: { kind: понятия,     body_section: '*',         target: документы }
    reverse: { kind: документы,   body_section: "Связанные понятия", action: append_slug }

  # темы body wikilink → документы/понятия/процессы → respective body "Темы"
  - forward: { kind: темы,        body_section: '*',         target: документы }
    reverse: { kind: документы,   body_section: "Темы",     action: append_slug }
  - forward: { kind: темы,        body_section: '*',         target: понятия }
    reverse: { kind: понятия,     body_section: "Темы",     action: append_slug }
  - forward: { kind: темы,        body_section: '*',         target: процессы }
    reverse: { kind: процессы,    body_section: "Темы",     action: append_slug }

terminal_targets: [foundations]
