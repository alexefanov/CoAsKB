# xref.yaml — Bidirectional link contract.
#
# Whenever entity A writes a forward link to entity B, the reverse update on B
# is required. Each rule has:
#
#   forward.kind                     source entity kind
#   forward.<frontmatter_field |     where the forward link lives:
#            body_section       |       frontmatter list field, OR
#            edge_type>                 body section (use '*' for any), OR
#                                       graph edge type
#   forward.target                   target entity kind
#
#   reverse.kind                     target entity kind (same as forward.target)
#   reverse.<frontmatter_field |     where the reverse update goes
#            body_section>
#   reverse.action                   append_slug | append_record
#   record                           record template (only for append_record);
#                                    {from} expands to the source slug
#
# Foundations are terminal: any link to foundations writes no reverse.
#
# Edge-based reverse links are handled by the graph engine, not by xref.yaml.
# This file covers only frontmatter-to-frontmatter and body-wikilink-to-frontmatter reverse rules.

rules:

  # papers body wikilink → concepts → concepts body "Sources"
  - forward: { kind: papers,      body_section: '*',         target: concepts }
    reverse: { kind: concepts,    body_section: "Sources",   action: append_slug }

  # papers body wikilink → methods → methods body "Normative references"
  - forward: { kind: papers,      body_section: '*',         target: methods }
    reverse: { kind: methods,     body_section: "Normative references", action: append_slug }

  # methods body wikilink → papers → papers body "Applied in"
  - forward: { kind: methods,     body_section: '*',         target: papers }
    reverse: { kind: papers,      body_section: "Applied in", action: append_slug }

  # concepts body wikilink → papers → papers body "Related concepts"
  - forward: { kind: concepts,    body_section: '*',         target: papers }
    reverse: { kind: papers,      body_section: "Related concepts", action: append_slug }

  # topics body wikilink → papers/concepts/methods → respective body "Topics"
  - forward: { kind: topics,      body_section: '*',         target: papers }
    reverse: { kind: papers,      body_section: "Topics",    action: append_slug }
  - forward: { kind: topics,      body_section: '*',         target: concepts }
    reverse: { kind: concepts,    body_section: "Topics",    action: append_slug }
  - forward: { kind: topics,      body_section: '*',         target: methods }
    reverse: { kind: methods,     body_section: "Topics",    action: append_slug }

terminal_targets: [foundations]
