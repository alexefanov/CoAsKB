# doc-types.yaml — Перечень типов нормативных документов
# Источник: wiki/terms.md, секция 26 "Аббревиатуры нормативных документов"
# Агент дополняет при ingest нового типа документа.
#
# Формат: ключ = значение в frontmatter (papers.source_type)
#          name = полное наименование
#          abbreviations = список аббревиатур для поиска в тексте

ГОСТ:
  name: Государственный стандарт (межгосударственный)
  abbreviations: [ГОСТ]

ГОСТ Р:
  name: Государственный стандарт Российской Федерации (национальный)
  abbreviations: [ГОСТ Р]

ГОСТ Р ИСО:
  name: Государственный стандарт РФ, гармонизированный с ИСО
  abbreviations: [ГОСТ Р ИСО]

СП:
  name: Свод правил (документ по стандартизации)
  abbreviations: [СП]

СНиП:
  name: Строительные нормы и правила
  abbreviations: [СНиП]
  status: заменён_СП

ФЗ:
  name: Федеральный закон
  abbreviations: [ФЗ]

Кодекс:
  name: Кодекс Российской Федерации
  abbreviations: [Кодекс]

Постановление:
  name: Постановление (Пленума ВС/ВАС, Правительства РФ)
  abbreviations: [Постановление, ПП]

Приказ:
  name: Приказ министерства/ведомства
  abbreviations: [Приказ]

ОДМ:
  name: Общероссийский методический документ (дорожно-строительный)
  abbreviations: [ОДМ]

МДС:
  name: Методические документы в строительстве
  abbreviations: [МДС]

РД:
  name: Руководящий документ
  abbreviations: [РД]

СТО:
  name: Стандарт организации (объединения)
  abbreviations: [СТО]
  variants: [СТО НОСТРОЙ, СТО НОСТРОЙ/НОП, СТО Газпром]

ВСН:
  name: Ведомственные строительные нормы
  abbreviations: [ВСН]

МРР:
  name: Межрегиональные расценки
  abbreviations: [МРР]

Пособие:
  name: Пособие по проектированию/строительству
  abbreviations: [Пособие]

Рекомендации:
  name: Рекомендации (ведомственные, отраслевые)
  abbreviations: [Рекомендации, Р]

другое:
  name: Документ, не попадающий в перечисленные категории
  abbreviations: []
