# doc-types.yaml — Перечень типов нормативных документов
# Источник: wiki/terms.md, секция 26 "Аббrevиатуры нормативных документов"
# Агент дополняет при ingest нового типа документа.
#
# Формат: ключ = значение в frontmatter (papers.source_type)
#          name = полное наименование
#          abbreviations = список аббревиатур для поиска в тексте

# === ГОСТы и стандарты ===

ГОСТ:
  name: Государственный стандарт (межгосударственный)
  abbreviations: [ГОСТ]

ГОСТ Р:
  name: Государственный стандарт Российской Федерации (национальный)
  abbreviations: [ГОСТ Р]

ГОСТ Р ИСО:
  name: Государственный стандарт РФ, гармонизированный с ИСО
  abbreviations: [ГОСТ Р ИСО]

ОСТ:
  name: Отраслевой стандарт
  abbreviations: [ОСТ]

СТО:
  name: Стандарт организации (объединения)
  abbreviations: [СТО]
  variants: [СТО НОСТРОЙ, СТО НОСТРОЙ/НОП, СТО Газпром]

СТП:
  name: Стандарт предприятия
  abbreviations: [СТП]

ТУ:
  name: Технические условия
  abbreviations: [ТУ]

МРТУ:
  name: Межреспубликанские технические условия
  abbreviations: [МРТУ]

