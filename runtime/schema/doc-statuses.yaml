# doc-statuses.yaml — Статусы нормативных документов
# Агент дополняет при ingest нового статуса.
#
# Формат: ключ = значение в frontmatter (papers.contribution_type)
#          name = полное наименование статуса

Действующий:
  name: Действующий документ
  description: Документ введён в действие и не отменён

Отмененный:
  name: Отменённый документ
  description: Документ утратил силу

Замененный:
  name: Заменённый документ
  description: Документ заменён другим (указать в cited_by)

Справочный:
  name: Справочный документ
  description: Документ используется как справочный материал

Неизвестный статус:
  name: Статус не определён
  description: Статус документа не установлен или требует уточнения
