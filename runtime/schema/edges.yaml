# edges.yaml — Relation contract for graph edges (incl. citations).
# edges.yaml — Контракт отношений для рёбер графа (включая цитирования).
#
# Each edge type declares / Каждый тип ребра объявляет:
#   endpoints   { from: <kind>, to: <kind> }  -- '*' means any kind / '*' — любой вид
#   direction   directed | symmetric           -- symmetric edges are stored once
#                                                 with sorted endpoints
#   workflow    which subsystem owns this edge type
#               (ingest | edit | check | evidence | experiment | provenance | citation)
#   attributes  schema for edge-record fields beyond from/to/type
#   priority    high — приоритет при автоматическом назначении (русские ребра)
#
# Storage location of each edge type is decided in conventions.yaml::edge_storage.
#
# Application rules (display, auto_reverse, validation, examples):
#   runtime/policy/edge-rules.yaml

# =============================================================================
# RUSSIAN DOMAIN EDGES (приоритетные) / РУССКИЕ ДОМЕННЫЕ РЁБРА
# Russets are prioritized over AutoSci analogs when both apply.
# =============================================================================

# ---------------------------------------------------------------------------
# Paper ↔ Paper edges (Russian domain)
# ---------------------------------------------------------------------------

ссылается_на:
  endpoints: { from: papers, to: papers }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes: {}

заменяет:
  endpoints: { from: papers, to: papers }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes:
    тип_замены: { type: enum, values: [full, partial], required: true }
    дата:       { type: date }

отменяет:
  endpoints: { from: papers, to: papers }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes:
    дата:     { type: date }
    причина:  { type: str }

вносит_изменения:
  endpoints: { from: papers, to: papers }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes:
    пункт:      { type: str }
    описание:   { type: str }

цитирует:
  endpoints: { from: papers, to: papers }
  direction: directed
  workflow:  citation
  priority:  high
  attributes:
    источник: { type: enum, values: [semantic_scholar, parsed_bib, manual], required: true }
    дата:     { type: date }
    пункт:    { type: str }
    контекст: { type: str }

# ---------------------------------------------------------------------------
# Paper → Concept edges (Russian domain)
# ---------------------------------------------------------------------------

дополняет:
  endpoints: { from: papers, to: concepts }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes: {}

вводит_термин:
  endpoints: { from: papers, to: concepts }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes:
    определение: { type: str }
    пункт:       { type: str }

использует_термин:
  endpoints: { from: [papers, methods], to: concepts }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes: {}

# ---------------------------------------------------------------------------
# Paper → Method edges (Russian domain)
# ---------------------------------------------------------------------------

регламентирует:
  endpoints: { from: papers, to: methods }
  direction: directed
  workflow:  ingest
  priority:  high
  attributes:
    уверенность: { type: enum, values: [высокая, средняя], required: true }
    пункт:       { type: str }

# ---------------------------------------------------------------------------
# Method → Method edges (Russian domain)
# ---------------------------------------------------------------------------

содержит_подпроцесс:
  endpoints: { from: methods, to: methods }
  direction: directed
  workflow:  edit
  priority:  high
  attributes:
    порядок:    { type: int }
    описание:   { type: str }

применяется_для:
  endpoints: { from: methods, to: topics }
  direction: directed
  workflow:  edit
  priority:  high
  attributes: {}

# ---------------------------------------------------------------------------
# Cross-entity evidence edges (Russian domain)
# ---------------------------------------------------------------------------

противоречит:
  endpoints: { from: '*', to: '*' }
  direction: symmetric
  workflow:  check
  priority:  high
  attributes:
    серьёзность: { type: enum, values: [явное, неявное], required: true }
    разрешение:  { type: str }

подтверждает:
  endpoints: { from: [methods, experiments], to: concepts }
  direction: directed
  workflow:  evidence
  priority:  high
  attributes:
    источник: { type: str }

# ---------------------------------------------------------------------------
# Project workflow edges (Russian domain)
# ---------------------------------------------------------------------------

проверяет_задачу:
  endpoints: { from: experiments, to: ideas }
  direction: directed
  workflow:  experiment
  priority:  high
  attributes: {}

проверяется_методом:
  endpoints: { from: methods, to: methods }
  direction: directed
  workflow:  experiment
  priority:  high
  attributes: {}

# ---------------------------------------------------------------------------
# Provenance & generic (Russian domain)
# ---------------------------------------------------------------------------

происходит_из:
  endpoints: { from: '*', to: '*' }
  direction: directed
  workflow:  provenance
  priority:  high
  attributes: {}

связан_с:
  endpoints: { from: '*', to: '*' }
  direction: symmetric
  workflow:  ingest
  priority:  high
  attributes:
    примечание: { type: str }

