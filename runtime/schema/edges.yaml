# edges.yaml — Relation contract for graph edges (incl. citations).
# edges.yaml — Контракт отношений для рёбер графа (включая цитирования).
#
# Each edge type declares / Каждый тип ребра объявляет:
#   endpoints   { from: <kind>, to: <kind> }  -- '*' means any kind / '*' — любой вид
#   direction   directed | symmetric           -- symmetric edges are stored once
#                                                 with sorted endpoints
#   workflow    which subsystem owns this edge type
#               (ingest | edit | check | evidence | experiment | provenance)
#   attributes  schema for edge-record fields beyond from/to/type
#
# Storage location of each edge type is decided in conventions.yaml::edge_storage.
#
# Application rules (display, auto_reverse, validation, examples):
#   runtime/policy/edge-rules.yaml

# =============================================================================
# Document ↔ Document edges  (workflow: ingest)
# Рёбра Документ ↔ Документ
# =============================================================================

ссылается_на:
  endpoints: { from: документы, to: документы }
  direction: directed
  workflow:  ingest
  attributes:
    пункт:    { type: str }
    контекст: { type: str }

заменяет:
  endpoints: { from: документы, to: документы }
  direction: directed
  workflow:  ingest
  attributes:
    тип_замены: { type: enum, values: [full, partial], required: true }
    дата:       { type: date }

дополняет:
  endpoints: { from: документы, to: документы }
  direction: symmetric
  workflow:  ingest
  attributes: {}

# =============================================================================
# Document → Process / Concept edges  (workflow: ingest)
# Рёбра Документ → Процесс / Понятие
# =============================================================================

регламентирует:
  endpoints: { from: документы, to: процессы }
  direction: directed
  workflow:  ingest
  attributes:
    уверенность: { type: enum, values: [высокая, средняя], required: true }
    пункт:       { type: str }

вводит_термин:
  endpoints: { from: документы, to: понятия }
  direction: directed
  workflow:  ingest
  attributes:
    определение: { type: str }
    пункт:       { type: str }

использует_термин:
  endpoints: { from: [документы, процессы], to: понятия }
  direction: directed
  workflow:  ingest
  attributes: {}

# =============================================================================
# Process → Process / Topic / Concept edges  (workflow: edit)
# Рёбра Процесс → Процесс / Тема / Понятие
# =============================================================================

включает_шаг:
  endpoints: { from: процессы, to: процессы }
  direction: directed
  workflow:  edit
  attributes:
    порядок:  { type: int }
    описание: { type: str }

применяется_для:
  endpoints: { from: процессы, to: темы }
  direction: directed
  workflow:  edit
  attributes: {}

распространяется_на:
  endpoints: { from: процессы, to: понятия }
  direction: directed
  workflow:  edit
  attributes:
    примечание: { type: str }

# =============================================================================
# Cross-entity evidence / check edges
# Рёбра подтверждения/противоречия (межсущностные)
# =============================================================================

противоречит:
  endpoints: { from: '*', to: '*' }
  direction: symmetric
  workflow:  check
  attributes:
    серьёзность: { type: enum, values: [явное, неявное], required: true }
    разрешение:  { type: str }

подтверждает:
  endpoints: { from: [процессы, испытания], to: понятия }
  direction: directed
  workflow:  evidence
  attributes:
    источник: { type: str }

# =============================================================================
# Project workflow edges  (workflow: experiment)
# Рёбра проектного цикла
# =============================================================================

проверяет_задачу:
  endpoints: { from: испытания, to: задачи }
  direction: directed
  workflow:  experiment
  attributes: {}

проверяется_методом:
  endpoints: { from: процессы, to: процессы }
  direction: directed
  workflow:  experiment
  attributes: {}

# =============================================================================
# Provenance & generic  (workflow: provenance | ingest)
# Происхождение и общая связь
# =============================================================================

происходит_из:
  endpoints: { from: '*', to: '*' }
  direction: directed
  workflow:  provenance
  attributes: {}

связан_с:
  endpoints: { from: '*', to: '*' }
  direction: symmetric
  workflow:  ingest
  attributes:
    примечание: { type: str }

