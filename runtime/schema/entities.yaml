# entities.yaml — Node contract for the wiki entity types.
# entities.yaml — Контракт узлов для типов сущностей вики.
#
# Field attributes / Атрибуты полей:
#   type           str | int | float | bool | date | enum | object | link
#                  | list_str | list_int | list_link | list_object
#   required       boolean, default false
#   default        literal value used by `lint --fix` / значение по умолчанию, используется `lint --fix`
#   range          [min, max] for int / float
#   values         [...] for enum
#   to             entity kind (or list of kinds) for link / list_link / вид сущности для link/list_link
#   required_when  { other_field: value } for conditional required / для условной обязательности
#   fields         nested schema for object / вложенная схема для объекта
#   item           per-element schema for list_object / поэлементная схема для list_object
#
# `terminal: true` means the entity writes no outward links (xref reverse-rule exempt).
# `terminal: true` — сущность не создаёт внешних ссылок (исключение из правил обратных ссылок xref).
#
# scope: wiki — сущности общей базы знаний (wiki/)
# scope: project — сущности в рамках конкретного проекта (projects/<slug>/)
#
# =============================================================================
# WIKI ENTITIES (9) / СУЩНОСТИ БАЗЫ ЗНАНИЙ
# =============================================================================

# ---------------------------------------------------------------------------
# papers — нормативные документы (ГОСТ, СП, ФЗ, СНиП, ПП и т.д.)
# Originally: academic papers
# ---------------------------------------------------------------------------
papers:
  dir: wiki/papers/
  fields:
    title:             { type: str, required: true }
    slug:              { type: str, required: true }
    arxiv:             { type: str }
    venue:             { type: str }
    year:              { type: int }
    tags:              { type: list_str, required: true, default: [] }
    importance:        { type: int, range: [1, 5], required: true, default: 3 }
    date_added:        { type: date }
    source_type:       { type: enum, required: true,
                         values: [ГОСТ, ГОСТ Р, ГОСТ Р ИСО, ОСТ, СТО, СТП, ТУ, МРТУ,
                                  ISO, IEC, ICAO, ILO, IMO, ANSI, API, ASME, ASTM, BS,
                                  DIN, NACE, ФЗ, Кодекс, Постановление, Приказ, СНиП, СП,
                                  СН, МСН, ТСН, МГСН, ОСТН, РСН, ГСН, ГЭСН, ЕНИР, ЕРЕР,
                                  ОСН, СНиР, ТЕР, ПВР, РД, ВРД, РДС, РТМ, МД, МДС, ОДМ,
                                  РМД, МИ, МР, МУ, МУК, Р, РМГ, П, ПБ, ПБЭиОТ, ПОТ,
                                  ИОТ, ТОИ, МПОТ, ППБ, ППР, НПБ, ТНПБ, ССБТ, ПУЭ,
                                  СанПиН, ГН, ППДК, ТР, ТР ТС, ОР, ЕСКД, ЕСПД, ЕСТД,
                                  ЕСТПП, ЕСЗКС, ЕТКС, ОК, ОНД, ОНТП, НТД, НПРМ, ОЕИ,
                                  ГСИ, ГСП, ГСС, ИД, ИПБ, ИРД, ПБОО, ПБУ, ПЗЗ, ПМС,
                                  ПНС, ПТС, РНиП, ССД, ТИ, ВСН, СТО Газпром, СТО НОСТРОЙ,
                                  СТО НОСТРОЙ/НОП, Р Газпром, Пособие, МРР, другое] }
    s2_id:             { type: str }
    tldr:              { type: str }
    contribution_type: { type: list_str, default: [] }
    datasets:          { type: list_str, default: [] }
    code_url:          { type: str }
    cited_by:          { type: list_link, to: papers, default: [] }
    number:            { type: str }
    oks:               { type: str }
    udk:               { type: str }
    bbk:               { type: str }

# ---------------------------------------------------------------------------
# concepts — термины, определения (один термин = одна страница)
# Originally: research concepts/ideas
# ---------------------------------------------------------------------------
concepts:
  dir: wiki/concepts/
  fields:
    title:            { type: str, required: true }
    aliases:          { type: list_str, default: [] }
    tags:             { type: list_str, required: true, default: [] }
    maturity:         { type: enum, values: [stable, active, emerging, deprecated],
                        required: true, default: active }
    definition:       { type: str }
    key_papers:       { type: list_link, to: papers, required: true, default: [] }
    first_introduced: { type: str }
    date_updated:     { type: date }
    related_concepts: { type: list_link, to: concepts, default: [] }
    linked_ideas:     { type: list_link, to: ideas, default: [] }
    parent_topic:     { type: link, to: topics }

# ---------------------------------------------------------------------------
# topics — тематические группы (определяются пользователем)
# Originally: thematic groupings
# ---------------------------------------------------------------------------
topics:
  dir: wiki/topics/
  fields:
    title:          { type: str, required: true }
    tags:           { type: list_str, required: true, default: [] }
    key_venues:     { type: list_str, default: [] }
    related_topics: { type: list_link, to: topics, default: [] }
    key_people:     { type: list_link, to: people, default: [] }
    key_papers:     { type: list_link, to: papers, default: [] }
    linked_ideas:   { type: list_link, to: ideas, default: [] }

# ---------------------------------------------------------------------------
# people — специалисты, организации
# Originally: researchers and organizations
# ---------------------------------------------------------------------------
people:
  dir: wiki/people/
  fields:
    name:           { type: str, required: true }
    affiliation:    { type: str }
    research_areas: { type: list_str, default: [] }
    homepage:       { type: str }
    scholar:        { type: str }
    date_updated:   { type: date }
    type:
      type: object
      fields:
        kind:    { type: enum, values: [researcher, team, organization], default: researcher }
        subtype: { type: str }

# ---------------------------------------------------------------------------
# ideas — задачи/вопросы/проблемы (в рамках проекта)
# Originally: research ideas / hypotheses
# ---------------------------------------------------------------------------
ideas:
  dir: wiki/ideas/
  fields:
    title:              { type: str, required: true }
    slug:               { type: str, required: true }
    status:             { type: enum,
                          values: [proposed, in_progress, tested, validated, failed],
                          required: true, default: proposed }
    origin:             { type: str, required: true }
    origin_gaps:        { type: list_link, to: [concepts, topics], default: [] }
    tags:               { type: list_str, required: true, default: [] }
    target_venue:       { type: str }
    novelty_score:      { type: int, range: [1, 5] }
    priority:           { type: int, range: [1, 5], required: true, default: 3 }
    pilot_result:       { type: str }
    failure_reason:     { type: str, required_when: { status: failed } }
    linked_experiments: { type: list_link, to: experiments, default: [] }
    date_proposed:      { type: date }
    date_resolved:      { type: date }
  lifecycle:
    transitions:
      proposed:    [in_progress]
      in_progress: [tested]
      tested:      [validated, failed]

# ---------------------------------------------------------------------------
# methods — процессы, методики, подпроцессы
# Originally: research methods/techniques
# ---------------------------------------------------------------------------
methods:
  dir: wiki/methods/
  fields:
    name:              { type: str, required: true }
    slug:              { type: str, required: true }
    type:
      type: enum
      values: [обследование, экспертиза, мониторинг, контроль, обработка,
               испытание, расчет, восстановление, комплексный, измерение, другое]
      required: true
      default: другое
    tags:              { type: list_str, required: true, default: [] }
    source_papers:     { type: list_link, to: papers, default: [] }
    parent_methods:    { type: list_link, to: methods, default: [] }
    child_methods:     { type: list_link, to: methods, default: [] }
    realizes_concepts: { type: list_link, to: concepts, default: [] }
    code_repo:         { type: str }
    date_updated:      { type: date }
    description:       { type: str }

# ---------------------------------------------------------------------------
# experiments — испытания / обследования
# Originally: experimental runs
# ---------------------------------------------------------------------------
experiments:
  dir: wiki/experiments/
  fields:
    title:             { type: str, required: true }
    slug:              { type: str, required: true }
    status:            { type: enum, values: [planned, running, completed, abandoned],
                         required: true, default: planned }
    linked_idea:       { type: link, to: ideas, required: true }
    evaluates_methods: { type: list_link, to: methods, default: [] }
    hypothesis:        { type: str, required: true }
    tags:              { type: list_str, required: true, default: [] }
    setup:
      type: object
      fields:
        object:    { type: str }
        standard:  { type: str }
        equipment: { type: str }
        type:      { type: str }
    metrics:         { type: list_str, default: [] }
    baseline:        { type: str }
    outcome:         { type: enum, values: [succeeded, failed, inconclusive] }
    key_result:      { type: str }
    date_planned:    { type: date }
    date_completed:  { type: date }
    run_log:         { type: str }
    started:         { type: str }
    estimated_hours: { type: int }
    remote:
      type: object
      fields:
        server:    { type: str }
        gpu:       { type: str }
        session:   { type: str }
        started:   { type: str }
        completed: { type: str }
  lifecycle:
    transitions:
      planned: [running]
      running: [completed, abandoned]

# ---------------------------------------------------------------------------
# Summary — синтез по теме из нескольких источников
# Originally: knowledge synthesis
# ---------------------------------------------------------------------------
Summary:
  dir: wiki/Summary/
  fields:
    title:        { type: str, required: true }
    scope:        { type: str, required: true }
    key_topics:   { type: list_link, to: topics, required: true, default: [] }
    paper_count:  { type: int }
    date_updated: { type: date }
    tags:         { type: list_str, required: true, default: [] }

# ---------------------------------------------------------------------------
# foundations — фундаментальные понятия (terminal: не создают обратных ссылок)
# Originally: fundamental concepts (unchanged)
# ---------------------------------------------------------------------------
foundations:
  dir: wiki/foundations/
  terminal: true
  fields:
    title:              { type: str, required: true }
    domain:             { type: str, required: true }
    status:             { type: enum, values: [mainstream, historical],
                          required: true, default: mainstream }
    aliases:            { type: list_str, default: [] }
    source_url:         { type: str }
    date_updated:       { type: date }

