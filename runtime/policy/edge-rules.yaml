# edge-rules.yaml — Application rules for typed edges in the construction domain.
# edge-rules.yaml — Правила применения типизированных рёбер в строительном домене.
#
# Каждый тип ребра = отдельная запись.
#
# Fields / Поля:
#   endpoints  { from: <kind>, to: <kind> }   'wiki:*' = any wiki entity, '*' = any entity
#   direction  directed | symmetric
#   workflow   ingest | edit | check | evidence | experiment | provenance
#   attributes schema for edge-record fields beyond from/to/type
#   display    label-template for graph viz, e.g. "→ регламентирует"
#   auto_reverse  bool | rule  — auto-create reverse edge or derive from attribute
#   validation validation rules for endpoints and values
#   examples   illustrative usage

# =============================================================================
# Document → Document semantic edges  (workflow: ingest)
# =============================================================================

ссылается_на:
  endpoints: { from: документы, to: документы }
  direction: directed
  workflow:  ingest
  attributes:
    пункт:     { type: str }
    контекст:  { type: str }
  display: "→ ссылается_на"
  auto_reverse: true    # creates "цитируется_в" automatically
  validation:
    endpoint_exists: true
    endpoint_kinds: [документы, документы]
  examples:
    - "СП 13-102-2003 → ссылается_на → ГОСТ 31937-2024 (п. 4.5, 'общие положения')"

заменяет:
  endpoints: { from: документы, to: документы }
  direction: directed
  workflow:  ingest
  attributes:
    тип_замены: { type: enum, values: [full, partial], required: true }
    дата:       { type: date }
  display: "→ заменяет"
  auto_reverse: true    # creates "заменён_на"
  validation:
    endpoint_exists: true
    endpoint_kinds: [документы, документы]
    newer_year_required: true   # from.year >= to.year
  examples:
    - "ГОСТ Р 50779.10-2000 → заменяет → ГОСТ 15895-77 (full, 2000-01-01)"

дополняет:
  endpoints: { from: документы, to: документы }
  direction: symmetric
  workflow:  ingest
  attributes: {}
  display: "↔ дополняет"
  auto_reverse: false    # symmetric — stored once
  validation:
    endpoint_exists: true
    endpoint_kinds: [документы, документы]
  examples:
    - "ГОСТ 31937-2024 ↔ дополняет ↔ СП 13-102-2003"

# =============================================================================
# Document → Process / Concept edges  (workflow: ingest)
# =============================================================================

регламентирует:
  endpoints: { from: документы, to: процессы }
  direction: directed
  workflow:  ingest
  attributes:
    уверенность: { type: enum, values: [высокая, средняя], required: true }
    пункт:       { type: str }
  display: "→ регламентирует"
  auto_reverse: true    # creates "регламентируется_документом"
  validation:
    endpoint_exists: true
    endpoint_kinds: [документы, процессы]
  examples:
    - "ГОСТ 31937-2024 → регламентирует → Комплексное обследование (высокая, п. 4.2)"

вводит_термин:
  endpoints: { from: документы, to: понятия }
  direction: directed
  workflow:  ingest
  attributes:
    определение: { type: str }
    пункт:       { type: str }
  display: "→ вводит_термин"
  auto_reverse: true    # creates "термин_из_документа"
  validation:
    endpoint_exists: true
    endpoint_kinds: [документы, понятия]
    text_unique: определение   # no duplicate definitions from same document
  examples:
    - "ГОСТ 31937-2024 → вводит_термин → Обследование технического состояния (п. 3.1)"

использует_термин:
  endpoints: { from: [документы, процессы], to: понятия }
  direction: directed
  workflow:  ingest
  attributes: {}
  display: "→ использует_термин"
  auto_reverse: true    # creates "термин_используется_в"
  validation:
    endpoint_exists: true
  examples:
    - "ГОСТ 31937-2024 → использует_термин → Дефект"

# =============================================================================
# Process → Process / Topic / Concept edges  (workflow: edit)
# =============================================================================

включает_шаг:
  endpoints: { from: процессы, to: процессы }
  direction: directed
  workflow:  edit
  attributes:
    порядок:     { type: int }
    описание:    { type: str }
  display: "→ включает_шаг"
  auto_reverse: true    # creates "шаг_процесса"
  validation:
    endpoint_exists: true
    endpoint_kinds: [процессы, процессы]
    parent_can_be_child: false  # no circular includes
    order_unique_in_parent: true
  examples:
    - "Комплексное обследование → включает_шаг → Визуальный осмотр (порядок: 1)"

применяется_для:
  endpoints: { from: процессы, to: темы }
  direction: directed
  workflow:  edit
  attributes: {}
  display: "→ применяется_для"
  auto_reverse: true    # creates "применяет_процесс"
  validation:
    endpoint_exists: true
  examples:
    - "Ультразвуковой контроль → применяется_для → Обследование бетонных конструкций"

распространяется_на:
  endpoints: { from: процессы, to: понятия }
  direction: directed
  workflow:  edit
  attributes:
    примечание: { type: str }
  display: "→ распространяется_на"
  auto_reverse: true    # creates "исследуется_методом"
  validation:
    endpoint_exists: true
    endpoint_kinds: [процессы, понятия]
  examples:
    - "Метод упругого отскока → распространяется_на → Бетон"

# =============================================================================
# Cross-entity evidence / contradiction edges  (workflow: check | evidence)
# =============================================================================

противоречит:
  endpoints: { from: '*', to: '*' }
  direction: symmetric
  workflow:  check
  attributes:
    серьёзность: { type: enum, values: [явное, неявное], required: true }
    разрешение:  { type: str }
  display: "↔ противоречит"
  auto_reverse: false
  validation:
    both_endpoints_exist: true
  examples:
    - "СП 13-102-2003 п. 5.2 ↔ противоречит ↔ ГОСТ 31937-2024 п. 4.1 (неявное, 'разные формулировки срока')"

подтверждает:
  endpoints: { from: [процессы, испытания], to: понятия }
  direction: directed
  workflow:  evidence
  attributes:
    источник: { type: str }
  display: "→ подтверждает"
  auto_reverse: true    # creates "подтверждено"
  validation:
    endpoint_exists: true
  examples:
    - "Лабораторные испытания кернов → подтверждает → Марка бетона М300"

# =============================================================================
# Project workflow edges  (workflow: experiment)
# =============================================================================

проверяет_задачу:
  endpoints: { from: испытания, to: задачи }
  direction: directed
  workflow:  experiment
  attributes: {}
  display: "→ проверяет_задачу"
  auto_reverse: true    # creates "задача_проверяется"
  validation:
    endpoint_exists: true
    endpoint_kinds: [испытания, задачи]
  examples:
    - "Испытание керна №3 → проверяет_задачу → Определить фактический класс бетона"

проверяется_методом:
  endpoints: { from: процессы, to: процессы }
  direction: directed
  workflow:  experiment
  attributes: {}
  display: "→ проверяется_методом"
  auto_reverse: true    # creates "метод_контроля"
  validation:
    endpoint_exists: true
    endpoint_kinds: [процессы, процессы]
  examples:
    - "Контроль качества бетона → проверяется_методом → Испытание на сжатие"

# =============================================================================
# Provenance & generic  (workflow: provenance)
# =============================================================================

происходит_из:
  endpoints: { from: '*', to: '*' }
  direction: directed
  workflow:  provenance
  attributes: {}
  display: "→ происходит_из"
  auto_reverse: true    # creates "источник_для"
  validation:
    both_endpoints_exist: true
  examples:
    - "Методика расчёта прогибов → происходит_из → СП 20.13330.2016"

связан_с:
  endpoints: { from: '*', to: '*' }
  direction: symmetric
  workflow:  ingest
  attributes:
    примечание: { type: str }
  display: "↔ связан_с"
  auto_reverse: false
  validation:
    both_endpoints_exist: true
    last_resort: true   # only when no more specific predicate applies
  examples:
    - "Визуальный осмотр ↔ связан_с → Фотограмметрия ('оба неразрушающие методы')"
