# writers.yaml — Field- and edge-level write permissions.
# writers.yaml — Права записи на уровне полей и рёбер.
#
# STATUS: SPEC, NOT A RUNTIME GATE / СТАТУС: СПЕЦИФИКАЦИЯ, НЕ ШЛЮЗ ВЫПОЛНЕНИЯ.
# Nothing in tools/ or .claude/skills/ reads this file at write time. It is a
# declarative contract for SKILL.md authors and for Claude when reading the
# repo's rules — "this is who is supposed to write this." Enforcement is at
# the prompt level (each skill's SKILL.md tells the agent what it writes), not
# at the CLI. We deliberately did not plumb a `--skill` arg through set-meta /
# add-edge: research workflows are fluid, and `/edit` exists as a designed
# escape hatch for "per user request" overrides — runtime enforcement here
# would either fight `/edit` or grow a long exception list.
#
# When this file disagrees with reality, update the file (or the offending
# SKILL.md) — do not add runtime checks.
#
# Default: a field or edge not listed here may be written by any skill
# (including /edit).  This file lists only the genuinely restricted ones —
# typically derived values, lifecycle transitions, and frozen-after-init data.
#
# `frozen_after_first_write: true` is also a spec marker, not a hard lock.
# It means: by convention, only the listed writers should set the initial
# value, and downstream skills should leave it alone. Identity-critical
# fields (papers.slug / arxiv / s2_id) — if you ever want a hard runtime
# lock, put it in tools/research_wiki.py::set_meta as a data-integrity
# check, not as a permission check driven by this file.

fields:

  # Document identity — set at ingest, frozen after.
  документы.doc_type:             { writers: [ingest], frozen_after_first_write: true }
  документы.number:               { writers: [ingest], frozen_after_first_write: true }
  документы.year:                 { writers: [ingest], frozen_after_first_write: true }
  документы.actualization_date:   { writers: [ingest], frozen_after_first_write: true }
  документы.raw_source:           { writers: [ingest], frozen_after_first_write: true }
  документы.replaced_by:          { writers: [ingest] }

  # Concept provenance — definition and source set at ingest.
  понятия.definition:             { writers: [ingest, edit] }
  понятия.source_document:        { writers: [ingest], frozen_after_first_write: true }

  # Topic curation — which documents / concepts anchor this area.
  темы.key_documents:             { writers: [ingest, edit] }
  темы.key_concepts:              { writers: [ingest, edit] }

  # Process structure — composition set at edit time.
  процессы.parent_processes:      { writers: [edit] }
  процессы.steps:                 { writers: [edit] }
  процессы.применяется_для:       { writers: [edit] }
  процессы.распространяется_на:   { writers: [edit] }

  # Project task lifecycle.
  задачи.status:                  { writers: [init-project, edit] }
  задачи.priority:                { writers: [init-project, edit] }

  # Test lifecycle.
  испытания.status:               { writers: [experiment] }
  испытания.outcome:              { writers: [experiment] }
  испытания.result:               { writers: [experiment] }

edges:

  # Document-document semantic — only /ingest produces these.
  ссылается_на:                  [ingest]
  заменяет:                      [ingest]
  дополняет:                     [ingest]

  # Document → process / concept — only /ingest produces these.
  регламентирует:                [ingest]
  вводит_термин:                 [ingest]
  использует_термин:             [ingest]

  # Process structure — only /edit produces these.
  включает_шаг:                  [edit]
  применяется_для:               [edit]
  распространяется_на:           [edit]

  # Cross-entity check / evidence.
  противоречит:                  [check]
  подтверждает:                  [evidence, ingest]

  # Project workflow — experiment skills produce these.
  проверяет_задачу:              [experiment]
  проверяется_методом:           [experiment]

  # Provenance and generic.
  происходит_из:                 [provenance, ingest]
  связан_с:                      [ingest, edit]
