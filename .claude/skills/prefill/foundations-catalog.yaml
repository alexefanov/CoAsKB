domains:
  # ============================================================================
  # CONSTRUCTION DOMAINS / СТРОИТЕЛЬНЫЕ ДОМЕНЫ
  # ============================================================================

  construction:
    - slug: building-inspection
      title: "Обследование зданий"
      summary: "Процесс определения технического состояния зданий и сооружений включая визуальный осмотр, неразрушающий контроль и инструментальные измерения"
    - slug: technical-condition
      title: "Техническое состояние"
      summary: "Характеристика степени физического износа и损伤 здания, определяемая по результатам обследования"
    - slug: defects-analysis
      title: "Анализ дефектов"
      summary: "Выявление, классификация и оценка дефектов строительных конструкций по типу, размеру и опасности"
    - slug: structural-health
      title: "Контроль состояния конструкций"
      summary: "Методы оценки несущей способности и работоспособности строительных конструкций в процессе эксплуатации"
    - slug: non-destructive-testing
      title: "Неразрушающий контроль"
      summary: "Методы контроля качества и состояния материалов и конструкций без повреждения объекта (ультразвук, виброакустика, термография)"

  monitoring:
    - slug: structural-monitoring
      title: "Мониторинг зданий"
      summary: "Систематическое наблюдение за состоянием зданий и сооружений с использованием датчиков и автоматизированных систем"
    - slug: deformation-monitoring
      title: "Мониторинг деформаций"
      summary: "Измерение и контроль перемещений, прогибов и деформаций строительных конструкций"
    - slug: sensor-systems
      title: "Системы датчиков"
      summary: "Технологии и оборудование для непрерывного сбора данных о состоянии зданий ( акселерометры, тензометры, GNSS)"

  construction-control:
    - slug: quality-control
      title: "Контроль качества"
      summary: "Совокупность операций по проверке соответствия строительных работ требованиям нормативных документов"
    - slug: acceptance-control
      title: "Приёмочный контроль"
      summary: "Контроль качества по завершении этапа работ или объекта в целом для принятия решения о приёмке"
    - slug: production-control
      title: "Производственный контроль"
      summary: "Система контроля качества, осуществляемая в процессе строительного производства"
    - slug: technical-supervision
      title: "Технический надзор"
      summary: "Надзор за соответствием проектной документации и нормативным требованиям в ходе строительства"

  forensic:
    - slug: forensic-engineering
      title: "Судебная инженерная экспертиза"
      summary: "Экспертиза, проводимая по определению суда или запросу следственных органов для установления причин дефектов и повреждений"
    - slug: damage-causation
      title: "Установление причин повреждений"
      summary: "Анализ причин возникновения дефектов и повреждений строительных конструкций для определения вины"
    - slug: expert-assessment
      title: "Экспертная оценка"
      summary: "Формализованная оценка соответствия объекта требованиям нормативных документов для целей правоприменения"

  compliance:
    - slug: conformity-assessment
      title: "Оценка соответствия"
      summary: "Процедура установления соответствия объекта требованиям технических регламентов, стандартов и договорных требований"
    - slug: technical-regulations
      title: "Технические регламенты"
      summary: "Документы, устанавливающие обязательные требования к объектам технического регулирования"
    - slug: certification
      title: "Сертификация"
      summary: "Процедура подтверждения соответствия продукции, процессов или услуг установленным требованиям"
    - slug: normative-documents
      title: "Нормативные документы"
      summary: "ГОСТ, СП, ФЗ, СНиП и другие документы, устанавливающие требования к проектированию, строительству и эксплуатации"
